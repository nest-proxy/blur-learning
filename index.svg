<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap');
      
      .bg { fill: #0b0f19; }
      .glass { fill: rgba(18, 24, 38, 0.7); stroke: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); }
      .text-main { font-family: 'Space Grotesk', sans-serif; fill: #ffffff; }
      .text-muted { font-family: 'Space Grotesk', sans-serif; fill: rgba(255, 255, 255, 0.5); }
      .accent { fill: #10b981; }
    </style>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" class="bg"/>
  <rect width="1440" height="900" fill="url(#grad)"/>

  <!-- Top Chrome-style Tabs Bar -->
  <rect x="0" y="0" width="1440" height="40" fill="#070a10"/>
  
  <!-- Tab 1 (Active) -->
  <path d="M 16 40 C 16 20, 24 10, 44 10 L 180 10 C 200 10, 208 20, 208 40 Z" fill="#0b0f19" stroke="rgba(255,255,255,0.08)"/>
  <text x="45" y="26" class="text-main" font-size="12">blur://newtab</text>

  <!-- Logo top right -->
  <g transform="translate(1380, 10)">
    <rect width="32" height="32" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
    <text x="10" y="22" class="text-main" font-weight="700" font-size="16">B</text>
  </g>

  <!-- Address Bar Row -->
  <rect x="0" y="40" width="1440" height="50" fill="#0b0f19" stroke="rgba(255,255,255,0.05)"/>
  
  <!-- Navigation Controls -->
  <circle cx="25" cy="65" r="12" fill="rgba(255,255,255,0.05)"/>
  <circle cx="55" cy="65" r="12" fill="rgba(255,255,255,0.05)"/>
  <circle cx="85" cy="65" r="12" fill="rgba(255,255,255,0.05)"/>

  <!-- URL Input Bar -->
  <rect x="120" y="50" width="1220" height="30" rx="15" fill="#121826" stroke="rgba(255,255,255,0.1)"/>
  <text x="140" y="70" class="text-muted" font-size="13">blur://newtab or search</text>

  <!-- Sidebar Apps Tray -->
  <rect x="0" y="90" width="60" height="810" fill="#070a10" stroke="rgba(255,255,255,0.05)"/>
  
  <!-- Center New Tab Hub -->
  <g transform="translate(450, 280)">
    <text x="170" y="40" class="text-main" font-weight="700" font-size="64" opacity="0.7">BLUR</text>
    <text x="180" y="75" class="text-muted" font-size="14">v0.1.0 • nest-proxy/blur-learning</text>
    
    <!-- Central Search Bar -->
    <rect x="0" y="110" width="540" height="46" rx="23" class="glass" stroke="rgba(255,255,255,0.15)"/>
    <text x="25" y="139" class="text-muted" font-size="14">search the web or type a blur:// command</text>
  </g>
</svg>
